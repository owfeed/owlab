# Developing podkop (https://github.com/itdoginfo/podkop) on a dev router.
#
# Copy this next to a podkop checkout, or point owlab at it from anywhere:
#
#   owlab --config examples/podkop up
#   owlab --config examples/podkop sync --watch
#
# podkop rewrites dnsmasq, builds a sing-box config and installs nftables
# rules, so it exercises far more of a router than a LuCI app usually does.
# That makes it a good stress test for owlab as well as a real workload.

version: 1

project:
  name: podkop

  # Where each directory of the repo ends up. Copied from the two Makefiles
  # rather than guessed: podkop's own install rule moves files/usr/lib/* to
  # /usr/lib/podkop/, not to /usr/lib/, and a straight `podkop/files: /` puts
  # constants.sh one directory too high. The daemon then exits at startup with
  #
  #   Error: required file '/usr/lib/podkop/constants.sh' is missing
  #
  # which is a plausible-looking bug report about a file you can see is there.
  install:
    podkop/files/usr/bin: /usr/bin
    podkop/files/usr/lib: /usr/lib/podkop
    podkop/files/etc/init.d: /etc/init.d
    luci-app-podkop/htdocs: /www
    luci-app-podkop/root: /
    # A second copy of the default uci config, somewhere sync is allowed to
    # write. sync never touches /etc/config — see below — so without this a
    # fresh router has no /etc/config/podkop at all and every `uci set` against
    # it answers "Entry not found".
    podkop/files/etc/config: /usr/share/podkop/defaults

  # sync never writes /etc/config or /etc/uci-defaults — that is the router's
  # state, not the package's. So editing podkop/files/etc/config/podkop here
  # does NOT overwrite the settings you configured on the router, which is what
  # you want while iterating. To pick up a change to the default config, edit
  # it on the router or start over with `owlab up --rebuild`.
  post_sync: |
    chmod +x /usr/bin/podkop /etc/init.d/podkop 2>/dev/null
    for f in /usr/share/podkop/defaults/*; do
      [ -f "$f" ] || continue
      [ -f "/etc/config/$(basename "$f")" ] || cp "$f" "/etc/config/$(basename "$f")"
    done
    /etc/init.d/podkop enable >/dev/null 2>&1
    /etc/init.d/podkop restart >/dev/null 2>&1 || true

defaults:
  # Everything podkop's package depends on. Installed here rather than pulled
  # in by installing podkop itself, because the point is to run YOUR checkout.
  packages:
    - +sing-box
    - +dnsmasq-full
    - +kmod-nft-tproxy
    - +kmod-nf-tproxy
    - +kmod-inet-diag
    - +kmod-tun
    - +curl
    - +jq
    - +bind-dig
    - +coreutils-base64

  # No invented networks. podkop writes firewall rules and a fake-IP range of
  # its own, and the fixtures' VLANs and zones are noise you would have to
  # reason around when a rule does not match.
  fixtures: [none]

routers:
  - id: pk2512
    release: "25.12.5"
    ports: { http: 8095, ssh: 2295 }

  # apk and opkg resolve podkop's dependencies differently — ImmortalWrt ships
  # dnsmasq-full where OpenWrt does not — so the 24.10 box is worth having.
  - id: pk2410
    release: "24.10.8"
    ports: { http: 8096, ssh: 2296 }

# ---------------------------------------------------------------------------
# Configuring it once the router is up
#
# Your VLESS/SS/etc. URL is a credential. Do not put it in this file; set it on
# the router:
#
#   owlab --config examples/podkop exec pk2512 -- \
#     'uci set podkop.main.proxy_string="vless://..."; uci commit podkop'
#
# Two settings need changing from podkop's defaults on a CONTAINER router. Both
# are container facts, not podkop bugs:
#
#   bootstrap_dns_server  podkop uses it as a plain UDP resolver on port 53,
#                         and some engines (OrbStack, measured) do not forward
#                         outbound UDP 53 at all. The engine's own resolver
#                         does answer — it is the first nameserver in
#                         /etc/resolv.conf. Without this sing-box exits with
#                         "lookup github.com: context deadline exceeded" on a
#                         router where https://github.com answers 200.
#
#   mixed_proxy_enabled   Turn it on to have something to test through. A
#                         container has no LAN clients, so the tproxy path has
#                         no traffic to catch; a SOCKS port does.
#
#   owlab --config examples/podkop exec pk2512 -- '
#     uci set podkop.settings.dns_type=doh
#     uci set podkop.settings.dns_server=https://dns.google/dns-query
#     uci set podkop.settings.bootstrap_dns_server=$(awk "\$1==\"nameserver\"{print \$2; exit}" /etc/resolv.conf)
#     uci set podkop.main.mixed_proxy_enabled=1
#     uci set podkop.main.mixed_proxy_port=2080
#     uci commit podkop
#     /etc/init.d/podkop restart'
#
# Then check it is really tunnelling:
#
#   owlab --config examples/podkop exec pk2512 -- '
#     IP=$(uci get network.lan.ipaddr)
#     echo "direct: $(curl -s -m 15 https://ifconfig.me)"
#     echo "proxy:  $(curl -s -m 25 -x socks5h://$IP:2080 https://ifconfig.me)"'
#
# Two different addresses means the tunnel carries traffic.
#
# `fidelity: vm` is the other option here. It boots OpenWrt's own kernel, so
# the tproxy modules load for real and outbound UDP is not the engine's to
# block — closer to the router podkop actually runs on, at the cost of a
# slower first start.
