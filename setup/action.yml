name: Set up owlab
description: Install a verified owlab binary and put it on PATH.

# Why this rather than `go install owfeed.org/owlab/cmd/owlab@sha`:
# that compiles the tool on every job of a matrix, needs a Go toolchain the job
# has no other use for, and verifies nothing — `go install` trusts whatever the
# module proxy returns for that revision. This downloads one binary and checks
# it against GitHub's own build attestation before running it.

inputs:
  version:
    description: >-
      Release tag to install, such as v0.2.0, or "latest". Leave it unset to
      install the release this action is pinned at: `setup@v0.6.4` installs
      v0.6.4. "latest" means the tool a CI result depends on can change under you
      between runs.
    required: false
    # Empty, not "latest". The default used to be "latest", so `uses:
    # owfeed/owlab/setup@v0.6.3` with no `version:` looked pinned and installed
    # whatever was newest -- and the pin dependabot moves is the `uses:` ref, never
    # this input. install.sh resolves empty to the action's own tag.
    default: ""
  verify:
    description: >-
      Verify the download against its build attestation. Turning this off runs
      an unverified binary; it exists only so that a broken Sigstore does not
      leave a repository with no way to run its tests.
    required: false
    default: "true"
  token:
    description: Token used to reach the release and the attestation API.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The version that was installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWLAB_VERSION: ${{ inputs.version }}
        OWLAB_VERIFY: ${{ inputs.verify }}
        # The expression, not the GITHUB_ACTION_REF variable, which is empty in
        # a composite action's steps. See install.sh.
        OWLAB_ACTION_REF: ${{ github.action_ref }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
