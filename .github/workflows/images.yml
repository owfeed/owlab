name: images

# Publish the prebuilt dev-router images to GHCR.
#
# The matrix and the build arguments both come from `owlab context`, reading
# images/owlab.yaml — the same code path `owlab up` uses locally. That is
# deliberate: a published image that was assembled by hand-written YAML would
# drift away from the one a developer builds, and the difference would only
# show up as a bug nobody can reproduce.

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/images.yml'
  # Point releases appear upstream on their own schedule, and a rebuild also
  # picks up feed changes within a pinned release.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercase: registries reject uppercase in a repository name, and the
  # GitHub owner here is mixed case.
  IMAGE: ghcr.io/vizzletf/owlab-rootfs

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: gen
        working-directory: images
        run: |
          go build -o /tmp/owlab ../cmd/owlab
          echo "matrix=$(/tmp/owlab context --list)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    # Native runners rather than QEMU. Building an aarch64 rootfs on an amd64
    # runner works, but every package install inside the image would run under
    # emulation — and installing the LuCI set is most of the build.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Prepare build context
        id: ctx
        working-directory: images
        run: |
          go build -o /tmp/owlab ../cmd/owlab
          /tmp/owlab context --router '${{ matrix.id }}' --out /tmp/publish >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          # One argument per line, so values containing spaces (PACKAGES
          # always does) survive without quoting games.
          mapfile -t build_args < /tmp/publish/buildargs
          docker buildx build \
            --platform '${{ matrix.platform }}' \
            "${build_args[@]}" \
            --tag "$IMAGE:${{ matrix.tag }}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=${{ matrix.distro }} ${{ matrix.release }} (${{ matrix.arch }}) dev router — procd as PID 1, LuCI installed" \
            --annotation "index:org.opencontainers.image.licenses=GPL-2.0-only" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.licenses=GPL-2.0-only" \
            --label "org.owlab.distro=${{ matrix.distro }}" \
            --label "org.owlab.release=${{ matrix.release }}" \
            --label "org.owlab.arch=${{ matrix.arch }}" \
            --push \
            '${{ steps.ctx.outputs.context }}'

      - name: Smoke test the published image
        run: |
          # procd must come up as PID 1 and answer on ubus. This is the check
          # that matters: running uhttpd without the init system makes LuCI
          # crash rather than degrade (openwrt/luci#8726), and the failure is
          # invisible until someone opens a page.
          set -eux
          docker run -d --name smoke --platform '${{ matrix.platform }}' \
            --cap-add NET_ADMIN --cap-add NET_RAW -t \
            "$IMAGE:${{ matrix.tag }}"
          for i in $(seq 30); do
            if docker exec smoke ubus call system board >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec smoke ubus call system board
          test "$(docker exec smoke cat /proc/1/comm)" = procd
          docker exec smoke test -s /usr/share/owlab/compliance/README
          docker exec smoke test -d /www/luci-static
          docker rm -f smoke
