name: images

# Publish the prebuilt dev-router images to GHCR.
#
# The matrix and the build arguments both come from `owlab context`, reading
# images/owlab.yaml — the same code path `owlab up` uses locally. That is
# deliberate: a published image that was assembled by hand-written YAML would
# drift away from the one a developer builds, and the difference would only
# show up as a bug nobody can reproduce.

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/images.yml'
  # Point releases appear upstream on their own schedule, and a rebuild also
  # picks up feed changes within a pinned release.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      keep:
        description: 'Point releases to publish per branch'
        type: string
        default: '2'
  # Called by the release workflow at a tag, so a released owlab has images
  # whose overlay is the one that binary ships with.
  workflow_call:
    inputs:
      version:
        description: 'Release tag these images belong to, e.g. v0.1.0'
        type: string
        required: false
      keep:
        description: 'Point releases to publish per branch'
        type: string
        required: false
        default: '2'

env:
  REGISTRY: ghcr.io
  # Lowercase: registries reject uppercase in a repository name, and the
  # GitHub owner here is mixed case.
  IMAGE: ghcr.io/vizzletf/owlab-rootfs

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # KEEP is why this job reads the download server rather than just the
      # config. images/owlab.yaml pins one release per branch, and the pin is
      # what a developer building locally gets; the published set is the newest
      # KEEP point releases of those same branches, resolved here. So upstream
      # tagging 25.12.5 puts an image on GHCR without anyone editing a version
      # number, and the release before it stays available for whoever has not
      # moved yet.
      - id: gen
        working-directory: images
        env:
          KEEP: ${{ inputs.keep || '2' }}
        run: |
          go build -o /tmp/owlab ../cmd/owlab
          /tmp/owlab releases || true
          echo "matrix=$(/tmp/owlab context --list --keep "$KEEP")" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    # Native runners rather than QEMU. Building an aarch64 rootfs on an amd64
    # runner works, but every package install inside the image would run under
    # emulation — and installing the LuCI set is most of the build.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Prepare build context
        id: ctx
        working-directory: images
        run: |
          go build -o /tmp/owlab ../cmd/owlab
          /tmp/owlab context --router '${{ matrix.id }}' --release '${{ matrix.release }}' \
            --out /tmp/publish >> "$GITHUB_OUTPUT"

      - name: Decide the tags
        id: tags
        run: |
          set -euo pipefail
          # The moving tag always. A release adds an immutable one beside it,
          # so `image: ghcr.io/...:x86_64-25.12.4-v0.1.0` in an owlab.yaml
          # keeps meaning the same bytes after the next rebuild — the moving
          # tag does not, because a weekly rebuild picks up feed changes
          # within the same pinned release.
          {
            echo "args<<EOF"
            echo "--tag"
            echo "$IMAGE:${{ matrix.tag }}"
            if [ -n "${{ inputs.version }}" ]; then
              echo "--tag"
              echo "$IMAGE:${{ matrix.tag }}-${{ inputs.version }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          # One argument per line, so values containing spaces (PACKAGES
          # always does) survive without quoting games.
          mapfile -t build_args < /tmp/publish/buildargs
          mapfile -t tag_args <<< '${{ steps.tags.outputs.args }}'
          docker buildx build \
            --platform '${{ steps.ctx.outputs.platform }}' \
            "${build_args[@]}" \
            "${tag_args[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=${{ matrix.distro }} ${{ matrix.release }} (${{ matrix.arch }}) dev router — procd as PID 1, LuCI installed" \
            --annotation "index:org.opencontainers.image.licenses=GPL-2.0-only" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.licenses=GPL-2.0-only" \
            --label "org.owlab.distro=${{ matrix.distro }}" \
            --label "org.owlab.release=${{ matrix.release }}" \
            --label "org.owlab.arch=${{ matrix.arch }}" \
            --label "org.opencontainers.image.version=${{ inputs.version || github.sha }}" \
            --push \
            '${{ steps.ctx.outputs.context }}'

      - name: Smoke test the published image
        run: |
          # procd must come up as PID 1 and answer on ubus. This is the check
          # that matters: running uhttpd without the init system makes LuCI
          # crash rather than degrade (openwrt/luci#8726), and the failure is
          # invisible until someone opens a page.
          set -eux
          docker run -d --name smoke --platform '${{ steps.ctx.outputs.platform }}' \
            --cap-add NET_ADMIN --cap-add NET_RAW -t \
            "$IMAGE:${{ matrix.tag }}"
          for i in $(seq 30); do
            if docker exec smoke ubus call system board >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec smoke ubus call system board
          test "$(docker exec smoke cat /proc/1/comm)" = procd
          docker exec smoke test -s /usr/share/owlab/compliance/README
          docker exec smoke test -d /www/luci-static
          docker rm -f smoke
