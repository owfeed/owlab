name: ci

# Everything that has to hold before a tag is worth pushing. The release
# workflow does not repeat these: a tag is pushed to a commit that already ran
# through here, and duplicating the gates would only mean two places to keep
# in step.

on:
  push:
    branches: [main]
  pull_request:
  # Load-bearing, not a convenience for re-running by hand. `pins.yml` opens its
  # pull requests with `gh pr create` under GITHUB_TOKEN, and GitHub holds those:
  # "when a workflow using `GITHUB_TOKEN` creates or updates a pull request, the
  # resulting `pull_request` event creates workflow runs in an approval-required
  # state" -- the run is created and then held in `action_required` until a person
  # presses a button. NOT this repository's approval policy: owfeed-packages
  # measured that one, relaxing it at repository and organisation level at once,
  # and the hold stayed (owfeed/owfeed-packages#53). GitHub's own exception is
  # the way out and needs no credential -- "`workflow_dispatch` and
  # `repository_dispatch` events always create workflow runs" -- so `pins.yml`
  # dispatches this workflow on the pin branch after opening the pull request.
  # Check runs bind to a commit rather than to an event, and the head of the pin
  # branch IS the pull request's head commit, so the same contexts are reported
  # against it. Removing this line makes every proposed pin arrive unchecked.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          [ -z "$out" ] || { echo "not gofmt'd:"; echo "$out"; exit 1; }

      - run: go vet ./...
      - run: go test ./...

  # owlab is a developer's tool and it is installed on whatever they use, so
  # "it compiles on the maintainer's laptop" is not the bar. The VM tier in
  # particular has per-platform process handling — signals on unix, tasklist on
  # Windows — which only a real cross-compile exercises.
  #
  # windows/arm64 is here for the same reason it is in the release matrix: the
  # machines exist, and a tool that will not even build for them is a tool that
  # cannot be installed on them.
  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build ./...

  # The unit tests, on the hosts the README promises rather than only on the
  # one that is cheapest to run.
  #
  # A cross-compile proves the per-platform code parses; it proves nothing
  # about what it does. The things that differ are the things a Linux runner
  # cannot see: Windows reports every file as 0666 so nothing derived from a
  # source file's mode can be trusted, path separators are not "/", and
  # `owlab doctor` shells out to programs that are optional features there.
  #
  # These runners have no container engine that speaks Linux images, so this is
  # `go test` and `owlab doctor` — not e2e. Docker Desktop cannot be installed
  # on a GitHub runner, and the e2e job below covers what a real engine does.
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

      # doctor is the one command that must work on a machine where nothing
      # else does, which makes "it starts at all here" worth asserting. It
      # reports missing pieces as warnings and exits 0; a non-zero exit means
      # it found something it considers fatal, and on a bare runner there is
      # nothing fatal to find.
      #
      # `go run` rather than building and invoking the binary: the output name
      # differs by platform and PowerShell will not execute a file without the
      # .exe extension, which is exactly the kind of per-shell detail this job
      # exists to keep out of the way.
      - name: owlab doctor runs on a bare host
        run: |
          go run ./cmd/owlab doctor
          go run ./cmd/owlab version

  # The image build context ships inside the binary, so a shell script with a
  # syntax error is a runtime failure on someone else's router rather than a
  # build failure here. dash is what busybox ash is closest to.
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the rootfs overlay and tools with dash
        run: |
          set -eu
          found=0
          for f in $(find images/rootfs-extra tools -type f) ; do
            case "$(head -c 2 "$f")" in
              '#!') ;;
              *) continue ;;
            esac
            found=$((found + 1))
            dash -n "$f" || { echo "syntax error: $f"; exit 1; }
          done
          echo "checked $found scripts"
          [ "$found" -gt 0 ] || { echo "no scripts found — the glob is wrong"; exit 1; }

      - name: The changelog has a section for every tag-shaped version
        run: |
          set -eu
          sh tools/release-notes.sh "$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -n1)" >/dev/null
          echo "release notes extract cleanly from the newest section"

      - name: The installer the actions share parses
        run: bash -n setup/install.sh

      # Two rules, one script. A workflow may not name a release at all -- the
      # `routers` job below reads them from images/owlab.yaml -- because
      # GITHUB_TOKEN cannot push a change to .github/workflows/, so a literal
      # here is a pin `pins.yml` can never move (the refusal is quoted in
      # tools/pins.sh). images/Dockerfile still carries one, and it must equal a
      # pin: a stale copy fails nothing, an old release still builds. Measured on
      # 2026-09-04 -- `ARG BASE_IMAGE` still said 25.12.4 while the config had
      # been on 25.12.5 the whole time, and every job was green.
      - name: No workflow names a release, and images/Dockerfile names a pinned one
        run: sh tools/pins.sh check

  # The releases e2e and the action run against, read out of images/owlab.yaml
  # at run time rather than written into this file.
  #
  # Not a literal, because a literal here cannot be moved by `pins.yml`: its
  # push on 2026-09-09 was refused with
  #
  #   ! [remote rejected] pins/25.12.2 -> pins/25.12.2 (refusing to allow a
  #   GitHub App to create or update workflow `.github/workflows/ci.yml`
  #   without `workflows` permission)
  #
  # and no `permissions:` block can grant GITHUB_TOKEN that scope. The same
  # shape as the matrix job in images.yml, and the same code path: `owlab
  # context --list --keep 1` emits one row per router at the release the config
  # pins, without consulting the download server for newer ones.
  #
  # Selected by router id, not "every x86_64 router": the config also pins
  # ImmortalWrt 24.10, which e2e has never run, and quietly adding a fourth real
  # router to every push would be new load rather than a refactor. An id is not
  # a release number, so a bump leaves this list alone; an id that disappears
  # from the config fails here instead of shrinking the matrix.
  routers:
    runs-on: ubuntu-24.04
    outputs:
      e2e: ${{ steps.gen.outputs.e2e }}
      action_release: ${{ steps.gen.outputs.action_release }}
    env:
      E2E_ROUTERS: openwrt-2512-x86-64 openwrt-2410-x86-64 immortalwrt-2512-x86-64
      ACTION_ROUTER: openwrt-2512-x86-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: gen
        working-directory: images
        run: |
          set -eu
          go build -o "$RUNNER_TEMP/owlab" ../cmd/owlab
          "$RUNNER_TEMP/owlab" context --list --keep 1 > "$RUNNER_TEMP/routers.json"

          # Checked before it is used: a missing id would otherwise drop a
          # router from e2e without a word, and an empty action release means
          # "every router in owlab.yaml" to the action -- a green run that
          # tested something else.
          missing="$(jq -r --arg want "$E2E_ROUTERS $ACTION_ROUTER" \
            '($want | split(" ") | map(select(. != ""))) - [.include[].id] | .[]' \
            "$RUNNER_TEMP/routers.json")"
          if [ -n "$missing" ]; then
            echo "images/owlab.yaml has no router with id: $(echo $missing)" >&2
            echo "  a router was renamed or removed; update E2E_ROUTERS / ACTION_ROUTER in ci.yml" >&2
            exit 1
          fi

          e2e="$(jq -c --arg want "$E2E_ROUTERS" '
            . as $all
            | {include: [$want | split(" ") | .[] | select(. != "") as $id
                         | $all.include[] | select(.id == $id)
                         | {distro, release}]}' "$RUNNER_TEMP/routers.json")"
          action_release="$(jq -r --arg id "$ACTION_ROUTER" \
            '.include[] | select(.id == $id) | .release' "$RUNNER_TEMP/routers.json")"

          echo "e2e: $e2e"
          echo "action: $action_release"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "action_release=$action_release" >> "$GITHUB_OUTPUT"

  # Dogfooding, and the only test here that runs against OpenWrt rather than
  # against a description of how OpenWrt behaves.
  #
  # Both package managers, because that is the axis that breaks: apk from 25.12,
  # opkg on 24.10, and neither understands the other's command. ImmortalWrt
  # because it is the distribution assembled from a rootfs tarball rather than
  # inherited from a published image, so it is the only entry exercising that
  # half of the build.
  #
  # The assertions are about LuCI itself rather than about any package: what is
  # being verified is that owlab produces a router on which a package's own
  # assertions could pass — LuCI answers a logged-in request, the dispatcher
  # renders a config-driven page without an exception, and the fixtures those
  # pages need are really there.
  #
  # The routers and their releases come from the `routers` job above.
  e2e:
    needs: routers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.routers.outputs.e2e) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go build -o "$RUNNER_TEMP/owlab" ./cmd/owlab

      - name: owlab test
        run: |
          mkdir -p "$RUNNER_TEMP/e2e" && cd "$RUNNER_TEMP/e2e"
          "$RUNNER_TEMP/owlab" test \
            --distro '${{ matrix.distro }}' \
            --release '${{ matrix.release }}' \
            --assert 'http 200 /cgi-bin/luci/admin/status/overview' \
            --assert 'http 200 /cgi-bin/luci/admin/network/network' \
            --assert 'http 200 /cgi-bin/luci/admin/network/firewall' \
            --assert 'service uhttpd' \
            --assert 'uci network.wan' \
            --json > "$RUNNER_TEMP/report.json"

      - name: Report
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/report.json" ] || exit 0
          jq -r '.routers[] | "\(.id) \(if .ok then "pass" else "FAIL" end)"' "$RUNNER_TEMP/report.json"

  # The action is shell, and shell that only runs in other people's
  # repositories is shell nobody tests.
  #
  # One release, OpenWrt's current apk line, from the `routers` job.
  action:
    needs: routers
    runs-on: ubuntu-24.04
    env:
      # Recognised by the installer: use the owlab already on PATH instead of
      # downloading a release, so this tests the working tree. At job level so
      # the composite action's own steps see it.
      OWLAB_SKIP_INSTALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build owlab from this commit
        run: |
          go build -o "$RUNNER_TEMP/bin/owlab" ./cmd/owlab
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: ./action
        with:
          releases: ${{ needs.routers.outputs.action_release }}
          fixtures: "none"
          assert: |
            http 200 /cgi-bin/luci/admin/status/overview
            service uhttpd
